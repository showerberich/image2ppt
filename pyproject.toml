[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "image2ppt"
version = "1.0.0"
description = "把图片 / PDF 变成完全可编辑的 PPTX —— image2ppt.asia 的官方 Python 客户端与 CLI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "showerberich" }]
keywords = ["pptx", "powerpoint", "image-to-ppt", "ocr", "editable", "api", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Multimedia :: Graphics",
    "Environment :: Console",
]
dependencies = []

[project.urls]
Homepage = "https://image2ppt.asia"
Repository = "https://github.com/showerberich/image2ppt"
Issues = "https://github.com/showerberich/image2ppt/issues"

[project.scripts]
image2ppt = "image2ppt.cli:main"

[tool.setuptools.packages.find]
include = ["image2ppt*"]
